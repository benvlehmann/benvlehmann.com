intro: I get to do what I do thanks to many others, and I do my best to pay that support forward to the next generation.
items:
  - title: Teaching in prisons
    body: >-
      From the <a href="http://prisonuniversityproject.org">Prison University Project</a> at San Quentin,
      to the UCSC <a href="https://sites.google.com/site/ucscpie/">Project for Inmate Education</a>,
      to teaching with <a href="http://teji.mit.edu">TEJI</a> at MIT.
  - title: Kids &amp; classrooms
    body: >-
      Classroom conversations through <a href="https://www.skypeascientist.com">Skype a Scientist</a>,
      and pen-pal letters through <a href="https://www.prescientist.org">Letters to a Pre-Scientist</a>.
  - title: Physics Values Committee
    body: >-
      Working on inclusion and community in MIT Physics as part of the
      <a href="https://physvals.mit.edu">Physics Values Committee</a>.
      If you have a concern or just want to talk, reach out.
  - title: Mentoring
    body: >-
      Undergraduate research, <a href="https://ucscwomeninphysics.wixsite.com/ucscwipa/mentoring">SPS/WiPA</a> mentoring,
      <a href="https://www.su5.group">SU(5)</a> peer mentoring for new grad students,
      and the UCSC Physics Collaborative.
