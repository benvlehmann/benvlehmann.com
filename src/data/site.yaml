hero:
  eyebrow: Einstein Fellow · MIT Kavli Institute
  heading: Matter is a mystery.
  lede: >-
    I study dark matter, the invisible material that makes up 85% of all matter
    in the universe. My research combines techniques from particle physics,
    cosmology, and black hole physics to extract new hints about what dark
    matter is and how it behaves.
  more: >-
    What was the universe like just after the big bang? What particles and
    symmetries have we yet to discover? Why is there matter at all? The search
    for dark matter bears on all of these.
